name: Publish Fleet update
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['fleet-v*']
    paths: ['.github/fleet-publish-request.json']
permissions:
  contents: read
concurrency:
  group: fleet-production-release
  cancel-in-progress: false
jobs:
  request:
    name: Validate publication request
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      source_commit: ${{ steps.request.outputs.source_commit }}
      publish: ${{ steps.request.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check explicit intent, pinned source and successful source CI
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/validate-publish-request.mjs
  publish:
    needs: request
    if: needs.request.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      FLEET_D1_DATABASE_ID: ${{ vars.FLEET_D1_DATABASE_ID }}
      FLEET_WORKER_URL: ${{ vars.FLEET_WORKER_URL }}
      FLEET_WORKER_NAME: ${{ vars.FLEET_WORKER_NAME }}
      FLEET_RELEASES_BUCKET: ${{ vars.FLEET_RELEASES_BUCKET }}
      FLEET_DOCUMENTS_BUCKET: ${{ vars.FLEET_DOCUMENTS_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.request.outputs.source_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install ripgrep for Android build scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - run: npm ci
        working-directory: cloudflare-worker
      - run: bash scripts/check-all.sh
      - name: Install browser for navigation verification
        run: npx playwright install chromium
        working-directory: cloudflare-worker
      - run: node scripts/test-navigation-motion-browser.mjs
      - run: node scripts/test-next-service-browser.mjs
      - run: node scripts/test-ui-system-browser.mjs
      - run: node scripts/test-invoice-retry-browser.mjs
      - run: node scripts/test-invoice-auto-browser.mjs
      - run: node scripts/test-ordexa-browser.mjs
      - name: Save navigation verification images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-motion-verification
          path: |
            verification/navigation-motion/
            verification/next-service/
            verification/ui-system/
            verification/invoice-retry/
            verification/invoice-auto/
            verification/ordexa/
          if-no-files-found: warn
      - run: node scripts/test-static-routing.mjs
      - run: bash scripts/unpack-toolchain.sh
      - run: node scripts/test-server-large-storage-native.mjs
      - run: node scripts/test-ordexa-native.mjs
      - run: node scripts/test-local-invoice-reader.mjs
      - run: node scripts/test-invoice-reader-accuracy.mjs
      - run: node scripts/test-invoice-reader-full.mjs
      - run: node scripts/test-invoice-transport.mjs
      - run: node scripts/test-server-ota-policy.mjs
      - run: node scripts/test-server-http.mjs
      - run: node scripts/test-server-snapshot-sync.mjs
      - run: node scripts/test-server-system-mirror.mjs
      - run: node scripts/test-server-offload-native.mjs
      - run: node scripts/test-backup-retention-native.mjs
      - run: node scripts/test-backup-archive.mjs
      - run: node scripts/test-invoice-sources-native.mjs
      - run: node scripts/test-invoice-zip-native.mjs
      - name: Restore original signing key
        env:
          FLEET_KEYSTORE_BASE64: ${{ secrets.FLEET_KEYSTORE_BASE64 }}
        run: |
          test -n "$FLEET_KEYSTORE_BASE64"
          mkdir -p private/signing
          printenv FLEET_KEYSTORE_BASE64 | base64 --decode > private/signing/fleet-control-release.p12
          chmod 600 private/signing/fleet-control-release.p12
      - name: Build with original signing credentials
        env:
          FLEET_STORE_PASSWORD: ${{ secrets.FLEET_STORE_PASSWORD }}
          FLEET_KEY_PASSWORD: ${{ secrets.FLEET_KEY_PASSWORD }}
          FLEET_KEY_ALIAS: ${{ secrets.FLEET_KEY_ALIAS }}
          FLEET_SERVER_KEY: ${{ secrets.FLEET_SERVER_KEY }}
        run: bash scripts/build-android.sh all
      - run: node scripts/verify-apks.mjs
      - run: node scripts/prepare-release.mjs
      - run: python3 scripts/write-release-notes.py .build/release-notes.md
      - run: node scripts/publish-release.mjs --dry-run
      - name: Save full source and signed files as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLEET_TAG="fleet-v$(node -p 'JSON.parse(require("fs").readFileSync("release-config.json", "utf8")).releaseVersion')"
          if gh release view "$FLEET_TAG" >/dev/null 2>&1; then
            mkdir -p .build/existing-release
            gh release download "$FLEET_TAG" --pattern release-manifest.json --dir .build/existing-release
            cmp dist/release-manifest.json .build/existing-release/release-manifest.json
            echo 'The saved release matches. Continuing the deployment retry.'
          else
            FLEET_SOURCE_COMMIT="$(git rev-parse HEAD)"
            gh release create "$FLEET_TAG" --target "$FLEET_SOURCE_COMMIT" --title "Fleet Control $FLEET_TAG" --notes-file .build/release-notes.md dist/*.apk dist/*.apk.idsig dist/*.zip dist/release-manifest.json dist/SHA256SUMS.txt
          fi
      - run: node scripts/configure-worker.mjs
      - name: Set publishing credential and deploy compatible Worker
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLEET_RELEASE_TOKEN: ${{ secrets.FLEET_RELEASE_TOKEN }}
        run: |
          test -n "$FLEET_RELEASE_TOKEN"
          printenv FLEET_RELEASE_TOKEN | npx wrangler secret put RELEASE_TOKEN
          npx wrangler deploy
      - name: Upload and activate verified Server, Client and Web together
        env:
          FLEET_RELEASE_TOKEN: ${{ secrets.FLEET_RELEASE_TOKEN }}
        run: node scripts/publish-release.mjs
      - name: Verify live signed APK bytes and personnel mirror reads
        env:
          FLEET_SERVER_KEY: ${{ secrets.FLEET_SERVER_KEY }}
          FLEET_VERIFY_DEPLOYED_SOURCE: ${{ needs.request.outputs.source_commit }}
          FLEET_REQUIRE_HEALTHY_MIRROR: 'true'
        run: node scripts/probe-server-mirror.mjs
      - name: Remove private build files
        if: always()
        run: rm -rf private
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: |
            dist/release-manifest.json
            dist/SHA256SUMS.txt
