name: Read-only mirror diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/mirror-readonly-probe.yml', 'scripts/probe-server-mirror.mjs', 'scripts/tail-server-mirror.mjs']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
        working-directory: cloudflare-worker
      - name: Capture sanitized error details for our read-only delta request
        env:
          FLEET_WORKER_URL: ${{ vars.FLEET_WORKER_URL }}
          FLEET_SERVER_KEY: ${{ secrets.FLEET_SERVER_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLEET_WORKER_NAME: ${{ vars.FLEET_WORKER_NAME }}
        run: node scripts/tail-server-mirror.mjs
      - name: Save counts, HTTP status and Ray IDs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-readonly-diagnosis
          path: verification/mirror-probe/*.json
          if-no-files-found: error
          retention-days: 7
