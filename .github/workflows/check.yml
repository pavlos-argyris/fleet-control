name: Check saved source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check PowerShell OTA setup syntax
        shell: pwsh
        run: |
          $FleetTokens = $null
          $FleetErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'Setup_OTA_Secrets.ps1'), [ref]$FleetTokens, [ref]$FleetErrors) | Out-Null
          if ($FleetErrors.Count -gt 0) { throw ($FleetErrors | Out-String) }
      - name: Install ripgrep for Android build scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - run: npm ci
        working-directory: cloudflare-worker
      - run: bash scripts/check-all.sh
      - run: bash scripts/unpack-toolchain.sh
      - name: Compile both APKs with a disposable test signing key
        env:
          FLEET_STORE_PASSWORD: ci-test-only
          FLEET_KEY_PASSWORD: ci-test-only
          FLEET_KEY_ALIAS: test
          FLEET_SERVER_KEY: ci-test-configuration-not-for-production
        run: |
          mkdir -p private/signing
          keytool -genkeypair -keystore private/signing/fleet-control-release.p12 -storetype PKCS12 -alias test -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=Fleet CI' -storepass:env FLEET_STORE_PASSWORD -keypass:env FLEET_KEY_PASSWORD
          bash scripts/build-android.sh all
      - run: npx wrangler deploy --dry-run --config wrangler.example.jsonc --outdir ../.build/worker
        working-directory: cloudflare-worker
