name: Check saved source
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check PowerShell OTA setup syntax
        shell: pwsh
        run: |
          $FleetTokens = $null
          $FleetErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'Setup_OTA_Secrets.ps1'), [ref]$FleetTokens, [ref]$FleetErrors) | Out-Null
          if ($FleetErrors.Count -gt 0) { throw ($FleetErrors | Out-String) }
      - name: Install ripgrep for Android build scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - run: npm ci
        working-directory: cloudflare-worker
      - run: bash scripts/check-all.sh
      - name: Install browser for navigation verification
        run: npx playwright install chromium
        working-directory: cloudflare-worker
      - run: node scripts/test-store-billing-browser.mjs
      - run: node scripts/test-navigation-motion-browser.mjs
      - run: node scripts/test-next-service-browser.mjs
      - run: node scripts/test-ui-system-browser.mjs
      - run: node scripts/test-invoice-auto-browser.mjs
      - run: node scripts/test-ordexa-browser.mjs
      - run: node scripts/test-server-backup-browser.mjs
      - run: node scripts/test-staff-schedule-browser.mjs
      - run: node scripts/test-schedule-management-browser.mjs
      - run: node scripts/test-client-landscape-browser.mjs
      - run: node scripts/test-schedule-cpu-browser.mjs
      - run: node scripts/test-invoice-retry-browser.mjs
      - run: node scripts/test-invoice-recovery-browser.mjs
      - run: FLEET_CPU_PHASE=after node scripts/profile-schedule-cpu.mjs
      - name: Save navigation verification images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-motion-verification
          path: |
            verification/navigation-motion/
            verification/next-service/
            verification/ui-system/
            verification/invoice-auto/
            verification/ordexa/
            verification/server-backup/
            verification/staff-schedule/
            verification/schedule-management/
            verification/client-landscape/
            verification/schedule-cpu/
            verification/invoice-retry
            verification/invoice-recovery/
            verification/store-billing/
          if-no-files-found: warn
      - run: node scripts/test-static-routing.mjs
      - run: bash scripts/unpack-toolchain.sh
      - run: node scripts/test-server-large-storage-native.mjs
      - run: node scripts/test-store-billing-native.mjs
      - run: node scripts/test-store-billing-pipeline.mjs
      - run: node scripts/test-ordexa-native.mjs
      - run: node scripts/test-ordexa-server-sync-native.mjs
      - run: node scripts/test-local-invoice-reader.mjs
      - run: node scripts/test-invoice-reader-accuracy.mjs
      - run: node scripts/test-invoice-reader-full.mjs
      - run: node scripts/test-invoice-transport.mjs
      - run: node scripts/test-server-ota-policy.mjs
      - run: node scripts/test-server-http.mjs
      - run: node scripts/test-server-snapshot-sync.mjs
      - run: node scripts/test-server-system-mirror.mjs
      - run: node scripts/test-server-offload-native.mjs
      - run: python3 scripts/prepare-invoice-dependencies.py .build/backup-test-deps
      - run: node scripts/test-backup-streaming-native.mjs
      - run: node scripts/test-backup-jobs-native.mjs
      - run: node scripts/test-backup-retention-native.mjs
      - run: node scripts/test-backup-archive.mjs
      - run: node scripts/test-invoice-sources-native.mjs
      - run: node scripts/test-invoice-zip-native.mjs
      - name: Compile both APKs with a disposable test signing key
        env:
          FLEET_STORE_PASSWORD: ci-test-only
          FLEET_KEY_PASSWORD: ci-test-only
          FLEET_KEY_ALIAS: test
          FLEET_SERVER_KEY: ci-test-configuration-not-for-production
        run: |
          mkdir -p private/signing
          keytool -genkeypair -keystore private/signing/fleet-control-release.p12 -storetype PKCS12 -alias test -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=Fleet CI' -storepass:env FLEET_STORE_PASSWORD -keypass:env FLEET_KEY_PASSWORD
          bash scripts/build-android.sh all
      - run: node scripts/test-client-landscape-apk.mjs
      - name: Save packaged Client orientation verification
        uses: actions/upload-artifact@v4
        with:
          name: client-landscape-apk-verification
          path: verification/client-landscape/compiled-manifest.txt
          if-no-files-found: error
      - run: npx wrangler deploy --dry-run --config wrangler.example.jsonc --outdir ../.build/worker
        working-directory: cloudflare-worker
      - name: Prepare complete source handoff and checksums
        run: |
          mkdir -p verification/source
          git archive --format=zip --output=verification/source/Fleet_Control_Source.zip HEAD
          git rev-parse HEAD > verification/source/SOURCE_COMMIT.txt
          sha256sum verification/source/Fleet_Control_Source.zip | tee verification/source/SHA256SUMS.txt
      - name: Save complete source handoff
        uses: actions/upload-artifact@v4
        with:
          name: complete-source
          path: verification/source/
          if-no-files-found: error
