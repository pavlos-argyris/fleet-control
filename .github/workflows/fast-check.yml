name: Fast source checks
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate shell scripts
        run: |
          bash -n scripts/check-all.sh
          bash -n scripts/build-android.sh
      - name: Install Worker dependencies
        run: npm ci
        working-directory: cloudflare-worker
      - name: Run fast repository checks
        run: bash scripts/check-all.sh
      - name: Summarize failure
        if: failure()
        run: |
          echo "## Fast source checks failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Inspect the failed step logs; this workflow does not deploy." >> "$GITHUB_STEP_SUMMARY"
