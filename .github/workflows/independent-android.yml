name: Independent Android test delivery
on:
  workflow_dispatch:
  push:
    branches: [codex/issue-90-independent-android]
    paths-ignore: ['docs/**', 'AGENTS.md']
concurrency:
  group: independent-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash scripts/ci-ubuntu-packages.sh ripgrep
      - run: npm ci
        working-directory: cloudflare-worker
      - run: bash scripts/unpack-toolchain.sh
      - run: node scripts/test-independent-business.mjs
      - run: node scripts/test-independent-network.mjs
      - run: node scripts/test-independent-web.mjs
      - run: npx playwright install --with-deps chromium
        working-directory: cloudflare-worker
      - run: node scripts/test-independent-browser.mjs
      - name: Compile isolated APKs with disposable test signing
        env:
          FLEET_STORE_PASSWORD: ci-test-only
          FLEET_KEY_PASSWORD: ci-test-only
          FLEET_KEY_ALIAS: test
        run: |
          mkdir -p .build/independent-signing
          keytool -genkeypair -keystore .build/independent-signing/test.p12 -storetype PKCS12 -alias test -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=Fleet Independent CI' -storepass:env FLEET_STORE_PASSWORD -keypass:env FLEET_KEY_PASSWORD
          FLEET_KEYSTORE="$PWD/.build/independent-signing/test.p12" bash scripts/build-independent-android.sh
      - run: node scripts/test-business-runtime-resources.mjs --apk .build/independent-delivery/Fleet_Independent_Server_v1.0.0-test2.apk
      - name: Actual API30 APK JSON and full backup import regression
        timeout-minutes: 20
        env:
          FLEET_KEYSTORE: ${{ github.workspace }}/.build/independent-signing/test.p12
          FLEET_STORE_PASSWORD: ci-test-only
          FLEET_KEY_PASSWORD: ci-test-only
          FLEET_KEY_ALIAS: test
        run: bash scripts/test-independent-android.sh
      - name: Verify exact full saved-source CI before signing delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-independent-source-check.mjs
      - name: Save isolated test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-test-evidence
          path: |
            .build/independent-delivery/APK_VERIFICATION.json
            .build/independent-network/results.json
            .build/independent-browser/
            .build/independent-android-test/*.txt
            .build/independent-android-test/*.log
          if-no-files-found: error
  signed-test-delivery:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash scripts/ci-ubuntu-packages.sh ripgrep
      - run: npm ci
        working-directory: cloudflare-worker
      - run: bash scripts/unpack-toolchain.sh
      - name: Restore original signing key only inside CI
        env:
          FLEET_KEYSTORE_BASE64: ${{ secrets.FLEET_KEYSTORE_BASE64 }}
        run: |
          test -n "$FLEET_KEYSTORE_BASE64"
          mkdir -p private/signing
          printenv FLEET_KEYSTORE_BASE64 | base64 --decode > private/signing/fleet-control-release.p12
          chmod 600 private/signing/fleet-control-release.p12
      - name: Build isolated signed APKs without production runtime secrets
        env:
          FLEET_STORE_PASSWORD: ${{ secrets.FLEET_STORE_PASSWORD }}
          FLEET_KEY_PASSWORD: ${{ secrets.FLEET_KEY_PASSWORD }}
          FLEET_KEY_ALIAS: ${{ secrets.FLEET_KEY_ALIAS }}
          FLEET_REQUIRE_ORIGINAL_SIGNATURE: '1'
        run: bash scripts/build-independent-android.sh
      - run: node scripts/test-business-runtime-resources.mjs --apk .build/independent-delivery/Fleet_Independent_Server_v1.0.0-test2.apk
      - name: Prepare complete source and hashes
        run: |
          git archive --format=zip --output=.build/independent-delivery/Fleet_Control_Complete_Source.zip HEAD
          cp docs/ISSUE_90_INDEPENDENT_ANDROID_GR.md .build/independent-delivery/OWNER_TEST_GUIDE_GR.md
          python3 scripts/package-independent-delivery.py
      - name: Publish separate prerelease without production activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLEET_TEST_TAG="independent-android-test2-${GITHUB_SHA:0:12}"
          gh release create "$FLEET_TEST_TAG" --prerelease --latest=false --target "$GITHUB_SHA" --title 'Fleet Independent — δοκιμή δεύτερου κινητού' --notes-file .build/independent-delivery/RELEASE_NOTES.md .build/independent-delivery/*.apk .build/independent-delivery/*.zip .build/independent-delivery/*.json .build/independent-delivery/SHA256SUMS.txt .build/independent-delivery/OWNER_TEST_GUIDE_GR.md
      - name: Keep complete isolated delivery
        uses: actions/upload-artifact@v4
        with:
          name: independent-signed-complete-delivery
          path: .build/independent-delivery/
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f private/signing/fleet-control-release.p12
