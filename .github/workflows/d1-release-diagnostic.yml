name: Diagnose D1 release availability
on:
  push:
    branches: [ops/d1-release-diagnostic-5-59]
    paths: [.github/workflows/d1-release-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FLEET_D1_DATABASE_ID: ${{ vars.FLEET_D1_DATABASE_ID }}
      FLEET_WORKER_URL: ${{ vars.FLEET_WORKER_URL }}
      FLEET_WORKER_NAME: ${{ vars.FLEET_WORKER_NAME }}
      FLEET_RELEASES_BUCKET: ${{ vars.FLEET_RELEASES_BUCKET }}
      FLEET_DOCUMENTS_BUCKET: ${{ vars.FLEET_DOCUMENTS_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3e40994f49b98c54d5ca4063fd78ef1653111eb0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: cloudflare-worker
      - run: node scripts/configure-worker.mjs
      - name: Read-only D1 availability check - SELECT 1 only
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute fleet-control-db --remote --command "SELECT 1 AS read_check" --json
