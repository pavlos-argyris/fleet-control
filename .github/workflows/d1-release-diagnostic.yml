name: Diagnose D1 release availability
on:
  push:
    branches: [ops/d1-release-diagnostic-5-59]
    paths: [.github/workflows/d1-release-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FLEET_D1_DATABASE_ID: ${{ vars.FLEET_D1_DATABASE_ID }}
      FLEET_WORKER_URL: ${{ vars.FLEET_WORKER_URL }}
      FLEET_WORKER_NAME: ${{ vars.FLEET_WORKER_NAME }}
      FLEET_RELEASES_BUCKET: ${{ vars.FLEET_RELEASES_BUCKET }}
      FLEET_DOCUMENTS_BUCKET: ${{ vars.FLEET_DOCUMENTS_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3e40994f49b98c54d5ca4063fd78ef1653111eb0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: cloudflare-worker
      - run: node scripts/configure-worker.mjs
      - name: Inspect only one nonce-filtered read-only Worker request
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLEET_SERVER_KEY: ${{ secrets.FLEET_SERVER_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import {spawn} from 'node:child_process';
          import crypto from 'node:crypto';
          const nonce=crypto.randomUUID(),delay=ms=>new Promise(r=>setTimeout(r,ms));
          const child=spawn('npx',['--no-install','wrangler','tail','--format','json','--header','X-Fleet-Diagnostic:'+nonce],{env:process.env});
          let raw='',errors='';
          child.stdout.on('data',b=>{if(raw.length<1048576)raw+=b.toString();});
          child.stderr.on('data',b=>{if(errors.length<16384)errors+=b.toString();});
          await delay(12000);
          try{
            const response=await fetch(process.env.FLEET_WORKER_URL.replace(/\/$/,'')+'/api/server/connection-check?diagnostic='+nonce,{headers:{'X-Fleet-Server-Key':process.env.FLEET_SERVER_KEY,'X-Fleet-Diagnostic':nonce},signal:AbortSignal.timeout(15000)});
            console.log(JSON.stringify({connectionHttp:response.status}));
            await response.body?.cancel();
          }catch(e){console.log(JSON.stringify({requestError:e.name}));}
          await delay(15000);child.kill('SIGTERM');await delay(2000);
          const events=[];
          for(let i=0;i<raw.length;i++){
            if(raw[i]!=='{')continue;
            let depth=0,quoted=false,escape=false,end=-1;
            for(let j=i;j<raw.length;j++){
              const ch=raw[j];
              if(quoted){if(escape)escape=false;else if(ch==='\\')escape=true;else if(ch==='"')quoted=false;}
              else if(ch==='"')quoted=true;else if(ch==='{')depth++;else if(ch==='}'&&--depth===0){end=j;break;}
            }
            if(end<0)break;
            try{events.push(JSON.parse(raw.slice(i,end+1)));i=end;}catch{}
          }
          const clean=s=>{s=String(s);for(const key of ['FLEET_SERVER_KEY','CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID'])if(process.env[key])s=s.replaceAll(process.env[key],'[redacted]');const first=s.split('\n')[0];return first.length>800?first.slice(0,160)+' … '+first.slice(-600):first;};
          const selected=events.filter(e=>String(e.event?.request?.url||'').includes(nonce));
          console.log(JSON.stringify({matchingEvents:selected.length,diagnostics:selected.map(e=>({outcome:e.outcome,exceptions:(e.exceptions||[]).map(x=>clean(x.message)),messages:(e.logs||[]).flatMap(x=>x.message||[]).map(clean)}))}));
          if(!selected.length)console.log(JSON.stringify({tailExit:child.exitCode,tailBytes:raw.length,stderrBytes:errors.length,parsedEvents:events.length,tailErrors:(raw+'\n'+errors).split('\n').filter(s=>/ERROR|D1_ERROR|not authorized|permission|authentication|Unauthorized|code:/i.test(s)).map(clean).slice(-8)}));
          process.exit(0);
          NODE
